syntax = "proto3";
package platform.authentication.v1;
option go_package = "github.com/nutsp/7solutions-backend-challenge/core-user-manage/pkg/proto/core-authentication;authpb";

message Empty {}
message UserID { string id = 1; }
message LoginRequest { string email = 1; string password = 2; }
message TokenPair {
 string access_token = 1; string refresh_token = 2; string token_type = 3;
 string expires_at = 4; string user_id = 5;
}
message AccessToken { string access_token = 1; }
message RefreshToken { string refresh_token = 1; }
message Principal { string user_id = 1; reserved 2; }
message DeleteUserRequest { string access_token = 1; string user_id = 2; }
service AuthenticationService {
 rpc Login(LoginRequest) returns (TokenPair);
 rpc Authenticate(AccessToken) returns (Principal);
 rpc Refresh(RefreshToken) returns (TokenPair);
 rpc Logout(AccessToken) returns (Empty);
 rpc AuthorizeDelete(DeleteUserRequest) returns (Principal);
 rpc RevokeUser(UserID) returns (Empty);
}
